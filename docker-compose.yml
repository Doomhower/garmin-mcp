services:
  garmin-mcp:
    build: .
    container_name: garmin-mcp
    volumes:
      - /root/.config/garmin/connect-personal-api-key:/root/.config/garmin/connect-personal-api-key:ro
    networks:
      - dex_default
    ports:
      - "8091:8091"
    command: ["python", "garmin_mcp.py"]  # assumes main() uses transport="http"
    restart: unless-stopped

networks:
  dex_default:
    external: true
