services:
  garmin-mcp:
    build: .
    container_name: garmin-mcp
    # No API key is configured here: each MCP client sends its own key in the
    # X-Garmin-Api-Key (or Authorization: Bearer) header.
    networks:
      - dex_default
    ports:
      - "8091:8091"
    restart: unless-stopped

networks:
  dex_default:
    external: true
